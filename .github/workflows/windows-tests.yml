name: Windows tests

on:
  pull_request:
    paths:
      - 'friendbook/**'
      - 'tests/**'
      - 'scripts/**'
      - 'main.py'
      - 'pytest.ini'
      - 'requirements*.txt'
      - '.github/workflows/windows-tests.yml'
  push:
    branches: [main]
    paths:
      - 'friendbook/**'
      - 'tests/**'
      - 'scripts/**'
      - 'main.py'
      - 'pytest.ini'
      - 'requirements*.txt'
      - '.github/workflows/windows-tests.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Repeat drag regressions
        shell: pwsh
        run: |
          foreach ($round in 1..5) {
            Write-Host "Drag regression round $round"
            python -m pytest -q tests/test_gui.py -k "handle_drag or drag_multiple or pending_long_press"
            if ($LASTEXITCODE -ne 0) { throw "Drag regression failed in round $round" }
          }
